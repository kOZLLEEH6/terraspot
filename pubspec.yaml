name: terraspot
description: "Discover the world's most beautiful moments."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Karte: OpenStreetMap-Raster-Tiles, kein Token nötig
  flutter_map: ^8.3.1
  latlong2: ^0.10.1

  # State
  provider: ^6.1.5+1

  # Wetter: Open-Meteo, kein API-Key nötig
  http: ^1.6.0

  # "Navigation starten" -> externe Karten-App
  url_launcher: ^6.3.2

  # Persistenz: gespeicherte Spots, PRO-Status, eigene Spots
  shared_preferences: ^2.5.5

  # Foto-Upload beim Spot erstellen
  image_picker: ^1.2.3

  # GPS-Automatik: Standort beim Erstellen + Umkreisfilter (Web/Android/iOS)
  geolocator: ^14.0.3

  # Backend: Postgres + Auth + Storage. Wird nur aktiv, wenn Zugangsdaten
  # per --dart-define übergeben werden (sonst läuft die App im Mock-Modus).
  supabase_flutter: ^2.16.0

  # Passwort-Hashing für die lokale Anmeldung (kein Klartext).
  crypto: ^3.0.7

  # In-App-Käufe: Google Play Billing / Apple StoreKit für das PRO-Abo.
  in_app_purchase: ^3.3.0

  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Generiert die App-Icons für alle Plattformen aus einem Bild.
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/photos/
    - assets/branding/

# App-Icon: modernes Kiefer-Motiv (siehe assets/branding/icon.png).
# Neu generieren mit: dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/branding/icon.png"
  android: true
  adaptive_icon_background: "#0C2E22"
  adaptive_icon_foreground: "assets/branding/icon_foreground.png"
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    background_color: "#0C2E22"
    theme_color: "#2DD4BF"
